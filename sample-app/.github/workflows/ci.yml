# Pipeline template for a student project. Copy this file into your own repo.
# Rules: failed tests stop it, detected secrets stop it, CRITICAL image vulnerabilities stop it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sample-app:ci .
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          image-ref: sample-app:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
