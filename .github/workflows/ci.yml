# CI pipeline: runs on every push to main and on every pull request.
# Deployment stages (push image, SSH to EC2, health check) are added in Phase 10.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the whole Git history, not just the latest commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Rule: CRITICAL vulnerabilities stop the pipeline.
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Lower severities are shown as warnings only (exit-code 0).
      - uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          scan-type: fs
          scan-ref: backend
          severity: HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"

  docker-scan:
    name: Docker build + image scan (Trivy)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t deploy-platform-backend:ci .
      - name: Fail on CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          image-ref: deploy-platform-backend:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Report HIGH/MEDIUM as warnings
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          image-ref: deploy-platform-backend:ci
          severity: HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
